<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1214">
<title>Metartshop — Boshqaruv</title>
<style>
  :root{ --bg:#0e1214; --card:#171d20; --card2:#1e2528; --line:#2a3236;
         --fg:#eef2f3; --mut:#8c989d; --yel:#ffc400; --grn:#39d98a; --red:#ff6b6b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--fg);
        font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
        padding:16px 16px 40px; max-width:620px; margin:0 auto; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  h1{ font-size:20px; margin:0; letter-spacing:.2px; }
  h1 b{ color:var(--yel); }
  .upd{ font-size:12px; color:var(--mut); }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .card h2{ font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--mut);
            margin:0 0 10px; font-weight:600; }
  .big{ font-size:26px; font-weight:700; }
  .sub{ font-size:13px; color:var(--mut); margin-top:4px; }
  .stats{ display:flex; gap:18px; }
  .stat .n{ font-size:22px; font-weight:700; } .stat .l{ font-size:11px; color:var(--mut); }
  .plist{ display:flex; flex-direction:column; gap:8px; }
  .pitem{ display:flex; align-items:center; gap:10px; background:var(--card2);
          border-radius:10px; padding:9px 11px; font-size:13px; }
  .pitem .t{ font-variant-numeric:tabular-nums; color:var(--yel); font-weight:600; min-width:40px; }
  .pitem .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pitem .st{ font-size:11px; color:var(--mut); }
  .chip{ font-size:10px; padding:2px 7px; border-radius:20px; background:#243; color:var(--grn); }
  .chip.err{ background:#412; color:var(--red); }
  .post{ display:flex; gap:10px; align-items:center; background:var(--card2);
         border-radius:10px; padding:9px 11px; margin-bottom:8px; text-decoration:none; color:var(--fg); }
  .post .cap{ flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .post .eng{ font-size:12px; color:var(--mut); white-space:nowrap; }
  .refresh{ background:var(--yel); color:#111; border:none; border-radius:12px; padding:9px 14px;
            font-weight:700; font-size:13px; }
  .refresh:active{ opacity:.7; }
  .muted{ color:var(--mut); font-size:13px; }
  footer{ text-align:center; color:var(--mut); font-size:11px; margin-top:18px; }
</style>
</head>
<body>
<header>
  <h1>Metart<b>shop</b></h1>
  <button class="refresh" id="btn" onclick="load()">Yangilash</button>
</header>
<div class="upd" id="upd">Yuklanmoqda…</div>

<div class="row" style="margin-top:12px">
  <div class="card"><h2>Dollar</h2><div class="big" id="usd">—</div><div class="sub" id="usdd"></div></div>
  <div class="card"><h2>Ob-havo</h2><div class="big" id="temp">—</div><div class="sub" id="tempd"></div></div>
</div>

<div class="card" style="margin-bottom:12px">
  <h2>Instagram — @<span id="iguser">metart_shop</span></h2>
  <div class="stats">
    <div class="stat"><div class="n" id="foll">—</div><div class="l">Obunachi</div></div>
    <div class="stat"><div class="n" id="media">—</div><div class="l">Post</div></div>
    <div class="stat"><div class="n" id="kecha">—</div><div class="l">Kecha chiqdi</div></div>
  </div>
</div>

<div class="card" style="margin-bottom:12px">
  <h2>Oxirgi postlar</h2>
  <div id="recent" class="muted">—</div>
</div>

<div class="card" style="margin-bottom:12px">
  <h2>Bugun rejada</h2>
  <div id="today" class="plist"></div>
</div>

<div class="card">
  <h2>Keyingi postlar</h2>
  <div id="next" class="plist"></div>
</div>

<footer>Jonli yangilanadi · <span id="err"></span></footer>

<script>
const $ = id => document.getElementById(id);
const nf = n => (n==null||n===''?'—':(''+n).replace(/\B(?=(\d{3})+(?!\d))/g,' '));
const ico = t => /REEL/i.test(t)?'🎬':(/STOR/i.test(t)?'📖':'🖼');
const bust = u => u+(u.includes('?')?'&':'?')+'_='+Date.now();
const WCODE = {0:"Ochiq",1:"Asosan ochiq",2:"Bulutli",3:"To'liq bulutli",45:"Tuman",48:"Tuman",
  51:"Mayda yomg'ir",53:"Yomg'ir",55:"Yomg'ir",61:"Yomg'ir",63:"Yomg'ir",65:"Kuchli yomg'ir",
  71:"Qor",73:"Qor",75:"Kuchli qor",80:"Jala",81:"Jala",82:"Kuchli jala",95:"Momaqaldiroq",96:"Momaqaldiroq"};
function stChip(s){ if(s==='chiqdi') return '<span class="chip">chiqdi</span>';
  if(s==='xato') return '<span class="chip err">xato</span>';
  if(s==="o'tkazildi") return '<span class="st">o\'tkazildi</span>'; return ''; }

async function jget(u,ms){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms||8000);
  try{ const r=await fetch(bust(u),{cache:'no-store',signal:c.signal}); return await r.json(); } finally{ clearTimeout(t); } }

// Asia/Tashkent bo'yicha hozirgi sana/vaqt
function nowTash(){
  const p={}; new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tashkent',year:'numeric',month:'2-digit',
    day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);
  const day=`${p.year}-${p.month}-${p.day}`;
  const y=new Date(Date.now()-864e5); const yp={};
  new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tashkent',year:'numeric',month:'2-digit',day:'2-digit'})
    .formatToParts(y).forEach(x=>yp[x.type]=x.value);
  return { day, min:`${day}T${p.hour}:${p.minute}`, hm:`${p.hour}:${p.minute}`, yday:`${yp.year}-${yp.month}-${yp.day}` };
}

async function dollarLive(){
  try{ const d=await jget('https://open.er-api.com/v6/latest/USD'); const u=d.rates&&d.rates.UZS;
       if(u) return Math.round(u); }catch(e){}
  try{ const d=await jget('reja/dashboard.json'); if(d.dollar&&d.dollar.rate) return d.dollar.rate; }catch(e){}
  return null;
}
async function weatherLive(){
  try{ const d=await jget('https://api.open-meteo.com/v1/forecast?latitude=41.31&longitude=69.24'
      +'&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia/Tashkent');
    const c=d.current; return {temp:Math.round(c.temperature_2m),desc:WCODE[c.weather_code]||'',
      hi:Math.round(d.daily.temperature_2m_max[0]),lo:Math.round(d.daily.temperature_2m_min[0])}; }catch(e){}
  try{ const d=await jget('reja/dashboard.json'); const o=d.obhavo; if(o&&o.temp!=null) return o; }catch(e){}
  return null;
}

async function load(){
  const btn=$('btn'); btn.textContent='...';
  const T=nowTash();
  $('upd').textContent='Yangilangan: '+T.day+' '+T.hm;

  const pDollar=dollarLive().then(us=>{ if(us){ $('usd').textContent=nf(us)+" so'm"; $('usdd').textContent='bozor kursi'; } }).catch(()=>{});
  const pWeather=weatherLive().then(w=>{ if(w){ $('temp').textContent=w.temp+'°'; $('tempd').textContent=(w.desc||'')+' · '+w.lo+'…'+w.hi+'°'; } }).catch(()=>{});

  // postlar — to'g'ridan-to'g'ri repo fayllaridan (jonli)
  try{
    const pj=await jget('reja/posts.json');
    const posts=(Array.isArray(pj)?pj:(pj.posts||[])).filter(p=>!(''+p.id).startsWith('_'));
    let holat={}; try{ holat=await jget('reja/holat.json'); }catch(e){}
    posts.sort((a,b)=>(''+(a.at||'')).localeCompare(''+(b.at||'')));
    const today=posts.filter(p=>(''+p.at).startsWith(T.day));
    const next=posts.filter(p=>(''+(p.at||''))>T.min).slice(0,6);
    let kecha=0; for(const k in holat){ const v=holat[k];
      if(v&&v.status==='chiqdi'&&(''+(v.vaqt||'')).startsWith(T.yday)) kecha++; }
    $('kecha').textContent=nf(kecha);
    $('today').innerHTML= today.length ? today.map(p=>{ const s=(holat[p.id]||{}).status||'';
      return '<div class="pitem"><span class="t">'+(''+p.at).slice(11,16)+'</span><span class="nm">'+ico(p.type)+' '+p.id+'</span>'+stChip(s)+'</div>'; }).join('')
      : '<div class="muted">Bugun rejada post yo\'q</div>';
    $('next').innerHTML= next.length ? next.map(p=>
      '<div class="pitem"><span class="t">'+(''+p.at).slice(5,10).replace('-','.')+'</span><span class="nm">'+ico(p.type)+' '+p.id+'</span><span class="st">'+(''+p.at).slice(11,16)+'</span></div>').join('')
      : '<div class="muted">—</div>';
  }catch(e){ $('err').textContent='postlar: '+e.message; }

  // Instagram raqamlari — serverdagi snapshotdan (token kerak)
  try{
    const d=await jget('reja/dashboard.json'); const ig=d.instagram||{};
    $('iguser').textContent=ig.username||'metart_shop';
    $('foll').textContent=nf(ig.followers); $('media').textContent=nf(ig.media_count);
    const rc=ig.posts||[];
    $('recent').innerHTML= rc.length ? rc.map(p=>
      '<a class="post" href="'+(p.link||'#')+'" target="_blank"><span>'+ico(p.type)+'</span>'+
      '<span class="cap">'+(p.caption||'—')+'</span>'+
      '<span class="eng">❤ '+nf(p.like)+'  💬 '+nf(p.comment)+'</span></a>').join('')
      : '<div class="muted">—</div>';
  }catch(e){}

  await Promise.all([pDollar,pWeather]);
  btn.textContent='Yangilash';
}
load();
setInterval(load, 3*60*1000);
</script>
</body>
</html>
