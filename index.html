<title>Metartshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="app-style">
/* Layout: phone-first shop app in the Metartshop yellow/black brand — logo bar, search, promo strip, banner, 2-col category tiles, product grid, fixed bottom tab bar */
:root{
  --bg:#f4f4f1; --card:#ffffff; --ink:#111111; --muted:#676a6e; --line:#e3e3df;
  --brand:#ffe81a; --brand-ink:#111111; --brand-soft:#fff8c2; --steel:#141414; --ok:#1f7a4d; --bad:#c2410c;
  --f-display:"Russo One","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:18px; --nav:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e0d; --card:#1a1a18; --ink:#f2f2ee; --muted:#a2a39e; --line:#2b2b28;
  --brand:#ffe81a; --brand-ink:#111111; --brand-soft:#3a3410; --steel:#000000; --ok:#5cc58f; --bad:#ff8a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e0d; --card:#1a1a18; --ink:#f2f2ee; --muted:#a2a39e; --line:#2b2b28;
  --brand:#ffe81a; --brand-ink:#111111; --brand-soft:#3a3410; --steel:#000000; --ok:#5cc58f; --bad:#ff8a5c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:720px;margin:0 auto;padding-bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom,0px))}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}

/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line)}
.top-row{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-block:10px;max-width:720px;margin:0 auto}
.logo{justify-self:center;display:flex;align-items:center;gap:8px;min-width:0;border:0;background:none;padding:0}
.logo img{height:38px;width:38px;border-radius:50%;object-fit:cover}
.logo-word{font-family:var(--f-display);font-size:20px;letter-spacing:.03em;white-space:nowrap}
.logo-word b{font-weight:400;font-family:var(--f-body);font-size:13px;letter-spacing:.35em;margin-left:6px;vertical-align:middle}
.langbtn{justify-self:end;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:12px;font-weight:700;letter-spacing:.04em}
.back{border:0;background:none;font-size:24px;line-height:1;padding:6px;justify-self:start}
.search{padding-bottom:12px;max-width:720px;margin:0 auto}
.search label{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 14px}
.search input{border:0;background:transparent;outline:none;width:100%;min-width:0;font-size:16px}
.search svg{flex:none;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}

/* home */
.promo{margin-top:16px;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:12px 16px;font-weight:600;font-size:15px}
.banner{margin-top:16px;border-radius:var(--r);overflow:hidden;aspect-ratio:2.2/1;max-width:100%;background:var(--steel);position:relative}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner-art{position:absolute;inset:0;display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 20px;gap:10px;color:#fff}
.banner-art h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,7vw,40px);line-height:1;color:#ffe81a}
.banner-art h2 b{display:block;font-family:var(--f-body);font-weight:400;font-size:.4em;letter-spacing:.6em;color:#fff;margin-top:6px}
.banner-art p{margin:10px 0 0;font-size:13px;color:#c9c9c2;max-width:30ch}
.banner-art svg{height:80%;max-height:150px;width:auto}
.banner-art .blogo{height:78%;max-height:170px;width:auto;aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px rgba(255,232,26,.18)}
.banner-art .cutp{fill:none;stroke:#e6e6de;stroke-width:1.6;stroke-linejoin:round}
.banner-art .hot{fill:none;stroke:#ffe81a;stroke-width:2.8;stroke-linecap:round;filter:drop-shadow(0 0 4px #ffb800)}
@media (prefers-reduced-motion:no-preference){
  .banner-art .cutp{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 3s ease-out .2s forwards}
  .banner-art .hot{stroke-dasharray:12 1000;stroke-dashoffset:1000;animation:draw 3s ease-out .2s forwards,fade .4s 3.2s forwards}
}
@media (prefers-reduced-motion:reduce){.banner-art .hot{display:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:0}}
.sec-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px;gap:10px}
.sec-head h2{font-size:28px;font-weight:700;letter-spacing:-.01em}
.link{border:0;background:none;font-weight:600;font-size:15px;display:flex;align-items:center;gap:4px;padding:4px 0}

/* category tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{position:relative;border:0;padding:0;border-radius:var(--r);overflow:hidden;aspect-ratio:3/4;max-width:100%;background:var(--steel);text-align:left;color:#fff;display:block;width:100%}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .art{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#3a3a36,#141414 72%)}
.tile .art svg{width:58%;height:auto}
.tile .art svg *{fill:none;stroke:#d8d8d0;stroke-width:1.4}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 55%,rgba(0,0,0,.72) 100%)}
.tile-count{position:absolute;top:14px;left:16px;right:16px;z-index:1;font-weight:700;font-size:13px;letter-spacing:.12em}
.tile-name{position:absolute;left:16px;bottom:18px;right:64px;z-index:1;font-weight:700;font-size:18px;line-height:1.2}
.tile-go{position:absolute;right:12px;bottom:12px;z-index:1;width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center}
.tile-go svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:2.2}
.tile.custom{color:#111}
.tile.custom .art{background:radial-gradient(circle at 50% 40%,#fff6a0,#ffe81a 70%)}
.tile.custom .art svg *{stroke:#111}
.tile.custom::after{background:none}
.tile.custom .tile-go{background:#111}
.tile.custom .tile-go svg{stroke:#ffe81a}

/* products */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line)}
.pimg{border:0;padding:0;background:var(--bg);aspect-ratio:1;max-width:100%;width:100%;display:grid;place-items:center;position:relative;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg svg{width:56%;height:auto}
.pimg svg *{fill:none;stroke:var(--muted);stroke-width:1.4}
.badge{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font-size:10.5px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:5px}
.badge.out{left:auto;right:8px;background:var(--muted)}
.badge.n{left:auto;right:8px;top:auto;bottom:8px;background:rgba(0,0,0,.6);color:#fff;letter-spacing:0}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.pname{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.pspec{font-size:12px;color:var(--muted)}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.price{font-weight:700;font-size:15px}
.plus{width:36px;height:36px;flex:none;border-radius:10px;border:0;background:var(--brand);color:var(--brand-ink);font-size:22px;line-height:1;display:grid;place-items:center}
.plus.in{background:var(--ink);color:var(--bg);font-size:14px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.title{font-size:24px;font-weight:700;margin:20px 0 4px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;color:var(--muted)}

/* forms */
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;margin-top:14px}
form{display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.err{color:var(--bad);font-size:13px;min-height:1em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;font-weight:700;border:1px solid transparent;text-decoration:none;font-size:15px}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-small{padding:7px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tiers div{border:1px solid var(--line);border-radius:8px;padding:8px 2px;text-align:center;font-size:12px;color:var(--muted)}
.tiers b{display:block;font-family:var(--f-mono);font-weight:500;font-size:14px;color:var(--ink)}
.botlink{border-left:4px solid var(--brand);background:var(--brand-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.botlink a{color:var(--ink);font-weight:700}
.note{font-size:13px;color:var(--muted);margin:0}

/* cart */
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--bg);overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:70%}
.thumb svg *{fill:none;stroke:var(--muted);stroke-width:2}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border:1px solid var(--line);background:var(--bg);border-radius:8px}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:var(--muted);position:relative}
.nav button[aria-current="page"]{color:var(--ink);font-weight:600}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.nav .cnt{position:absolute;top:6px;left:calc(50% + 6px);background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:1px solid var(--ink)}
.fab{position:fixed;z-index:19;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--steel);color:#ffe81a;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(8,8,8,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{font-size:20px}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;color:var(--muted)}
.gallery{position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:14px;scrollbar-width:none;background:var(--bg)}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;aspect-ratio:1;max-width:100%;scroll-snap-align:center;display:grid;place-items:center}
.slide img{width:100%;height:100%;object-fit:cover}
.slide svg{width:50%}
.slide svg *{fill:none;stroke:var(--muted);stroke-width:1.2}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--ink);width:18px;border-radius:4px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.thumbs button{flex:none;width:56px;height:56px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--bg)}
.thumbs button.on{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px;max-height:220px;overflow-y:auto;user-select:all}
.contact-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--line)}
.contact-line:last-child{border-bottom:0}
.contact-line span{color:var(--muted);font-size:13px}
.contact-line a,.contact-line b{font-weight:600;color:var(--ink);overflow-wrap:anywhere;user-select:all}

/* admin */
.admin{background:var(--brand-soft);border-bottom:1px solid var(--line)}
.admin-in{max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;padding-block:8px;font-size:13px}
.admin-in .acts{display:flex;flex-wrap:wrap;gap:6px}
.status{font-size:12.5px}
.status.ok{color:var(--ok)}
.status.bad{color:var(--bad)}
.edit-row{display:flex;gap:6px;margin-top:6px}
.edit-row button{flex:1}
.preview-img{max-height:120px;width:auto;border-radius:8px;border:1px solid var(--line)}
.imglist{display:flex;flex-wrap:wrap;gap:8px}
.imgitem{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.imgitem img{width:100%;height:100%;object-fit:cover}
.imgitem .first{position:absolute;left:4px;bottom:4px;background:var(--brand);color:#111;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px}
.imgitem button{position:absolute;top:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center}
.imgitem .rm{right:3px}
.imgitem .mk{left:3px}
.owner-link{display:block;margin:30px auto 0;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline}

@media (max-width:360px){.row{grid-template-columns:1fr}.tile-name{font-size:16px}}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>

</head>

function normalize(s){
  s.shop=s.shop||{};s.cats=s.cats||[];s.products=s.products||[];

  return s;
}

function ghApi(path,opt){
  opt=opt||{};opt.headers={"Authorization":"Bearer "+gh.token,"Accept":"application/vnd.github+json"};
  return fetch("https://api.github.com/repos/"+gh.repo+path,opt);
}
function ghVerify(){

function b64utf8(s){return btoa(unescape(encodeURIComponent(s)))}
function ghPut(path,b64,msg,sha){
  var body={message:msg,content:b64};if(sha)body.sha=sha;
  return ghApi("/contents/"+path,{method:"PUT",body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw new Error("put "+r.status);return r.json()});
}
async function ghSave(){
  var refs=[];
  function scan(obj,key){var v=obj[key];if(typeof v==="string"&&v.indexOf("data:")===0)refs.push({obj:obj,key:key})}
  scan(STATE.shop,"logo");scan(STATE.shop,"banner");
  STATE.cats.forEach(function(c){scan(c,"img")});
  STATE.products.forEach(function(p){p.imgs.forEach(function(_,i){scan(p.imgs,i)})});
  var stamp=Date.now().toString(36);
  for(var i=0;i<refs.length;i++){
    statusMsg=t("uploading")+" "+(i+1)+"/"+refs.length;statusBad=false;rerender();
    var d=refs[i].obj[refs[i].key],ext=d.indexOf("image/png")>0?"png":"jpg",path="img/"+stamp+"-"+i+"."+ext;
    await ghPut(path,d.split(",")[1],"Rasm: "+path);
    refs[i].obj[refs[i].key]=path;
  }
  if(!STATE.repo)STATE.repo=gh.repo;
  var cur=await ghApi("/contents/data.json").then(function(r){return r.ok?r.json():null});
  await ghPut("data.json",b64utf8(JSON.stringify(STATE,null,1)),"Do'kon ma'lumotlari yangilandi",cur&&cur.sha);
}

function resizeImage(file,max,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    cb(file.type==="image/png"&&max<=400?c.toDataURL("image/png"):c.toDataURL("image/jpeg",0.8));
  };im.onerror=function(){cb(null)};im.src=r.result};
  r.readAsDataURL(file);
}

var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(){

  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+

function save(){
  if(saving)return;
  if(MODE==="github"){
    saving=true;rerender();
    ghSave().then(function(){saving=false;dirty=false;statusMsg=t("ghSaved");statusBad=false;rerender()},function(){saving=false;statusMsg=t("failSave");statusBad=true;rerender()});
    return;
  }
  if(!artifactNs)return;
  var doc=buildDoc();
  if(doc.length>14*1024*1024){statusMsg=t("tooBig");statusBad=true;rerender();return}
  saving=true;rerender();
  artifactNs.publish(doc).then(function(){saving=false;dirty=false;statusMsg=t("saved");statusBad=false;rerender()},function(e){
    saving=false;var c=e&&e.code;
    if(c==="conflict"){rerender();return}
    if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="capability_disabled"||c==="consent_required"){admin=false;rerender();return}
    statusMsg=c==="too_large"?t("tooBig"):t("failSave");statusBad=true;rerender();
  });
}

  if(b.dataset.chip){catFilter=b.dataset.chip;view=catFilter==="all"?"catalog":"cat";rerender();return}

  if(b.dataset.slide){var sl=$("#slides");if(sl)sl.scrollTo({left:sl.clientWidth*(+b.dataset.slide),behavior:"smooth"});return}
  if(b.dataset.inc){cart[b.dataset.inc]++;saveCart();rerender();return}

  if(b.hasAttribute("data-sendcopy")){try{navigator.clipboard.writeText($("#layer").dataset.msg).catch(function(){})}catch(err){}return}
  if(b.id==="owner-login"){loginSheet();return}
  if(b.id==="install-app"&&installEvt){var ev=installEvt;installEvt=null;ev.prompt();ev.userChoice.finally(rerender);return}
  if(!admin)return;
  if(b.id==="a-logout"){LS.del("gh-token");LS.del("gh-repo");gh.token="";admin=false;rerender();return}
  if(b.dataset.clearimg){var k=b.dataset.clearimg;pendingImgs[k]="";$("#"+k+"-prev").hidden=true;b.hidden=true;return}
  if(b.dataset.rmimg){pendingList.splice(+b.dataset.rmimg,1);$("#imglist").innerHTML=imgListHTML();return}
  if(b.dataset.mkfirst){var it=pendingList.splice(+b.dataset.mkfirst,1)[0];pendingList.unshift(it);$("#imglist").innerHTML=imgListHTML();return}
  if(b.id==="a-settings"){settingsSheet();return}
  if(b.id==="a-cats"){catsSheet();return}
  if(b.id==="add-cat"){STATE.cats=collectCats();STATE.cats.push({id:"c"+Date.now().toString(36),uz:"Yangi bo'lim",ru:"Новый раздел",img:"",art:"boshqa"});catsSheet();dirty=true;return}
  if(b.dataset.delcat){var ci=+b.dataset.delcat,cc=STATE.cats[ci];if(countIn(cc.id)){$("#k-err").textContent=t("catHasItems");return}STATE.cats=collectCats();STATE.cats.splice(ci,1);catsSheet();dirty=true;return}
  if(b.id==="a-add"){productSheet2(null);return}
  if(b.id==="a-save"){save();return}
  if(b.id==="a-samples"){STATE.products=STATE.products.filter(function(p){return !p.sample});Object.keys(cart).forEach(function(k){if(!prod(k))delete cart[k]});saveCart();markDirty();return}
  if(b.dataset.edit){productSheet2(b.dataset.edit);return}
  if(b.dataset.del){
    if(pendingDel===b.dataset.del){var id=pendingDel;pendingDel=null;STATE.products=STATE.products.filter(function(p){return p.id!==id});delete cart[id];saveCart();markDirty()}
    else{pendingDel=b.dataset.del;b.textContent=t("confirmDel")}
    return;
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){query=e.target.value.trim();var m=$("#main");if(m)m.innerHTML=body()}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("#overlay"))closeSheet()});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="p-imgs"&&el.files.length){
    Array.prototype.forEach.call(el.files,function(f){resizeImage(f,1000,function(url){if(url){pendingList.push(url);var l=$("#imglist");if(l)l.innerHTML=imgListHTML()}})});
    el.value="";return;
  }
  var k=el.dataset&&el.dataset.imgfor;
  if(k&&el.files[0]){
    var max=k==="s-logo"?400:(k==="s-banner"?1400:900);
    resizeImage(el.files[0],max,function(url){if(!url)return;pendingImgs[k]=url;var pv=$("#"+k+"-prev");if(pv){pv.src=url;pv.hidden=false}var cb=document.querySelector('[data-clearimg="'+k+'"]');if(cb)cb.hidden=false});
  }
});
document.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target;
  function rc(px){return {name:$("#"+px+"-name").value.trim(),phone:$("#"+px+"-phone").value.trim(),city:$("#"+px+"-city").value.trim(),deliv:$("#"+px+"-deliv").value}}
  function cl(c){return [t("name")+": "+c.name,t("phone")+": "+c.phone,c.city?t("city")+": "+c.city:"",t("deliv")+": "+c.deliv].filter(Boolean)}
  if(f.id==="cart-form"){
    var c=rc("o");if(!c.name||!c.phone){$("#o-err").textContent=t("req");return}
    rememberMe(c);
    var l=["🛒 "+t("orderShop")+" — "+STATE.shop.name,""];
    Object.keys(cart).forEach(function(k){var p=prod(k);if(p)l.push("• "+L(p,"name")+(p.size?" ("+p.size+")":"")+" × "+cart[k]+" = "+money(p.price*cart[k]))});
    l.push("",t("total")+": "+money(cartTotal()),"");l=l.concat(cl(c));
    var cm=$("#o-comment").value.trim();if(cm)l.push(t("comment")+": "+cm);
    sendSheet(l.join("\n"));return;
  }
  if(f.id==="custom-form"){
    var c2=rc("c");if(!c2.name||!c2.phone){$("#c-err").textContent=t("req");return}
    rememberMe(c2);$("#c-err").textContent="";
    var w=$("#c-what").value.trim(),l2=["✂️ "+t("orderCustom")+" — "+STATE.shop.name,""];
    if(w)l2.push(t("what")+" "+w);
    l2=l2.concat([t("metal")+": "+$("#c-metal").value,t("thick")+": "+$("#c-thick").value,t("size")+": "+($("#c-size").value.trim()||"—"),t("qty")+": "+($("#c-qty").value||1),t("fileQ")+": "+$("#c-file").value,""]).concat(cl(c2));
    sendSheet(l2.join("\n"));return;
  }
  if(f.id==="me-form"){me={name:$("#m-name").value.trim(),phone:$("#m-phone").value.trim(),city:$("#m-city").value.trim()};LS.set("shop-me",JSON.stringify(me));$("#me-save").textContent=t("savedMe");return}
  if(f.id==="login-form"){
    gh.repo=$("#g-repo").value.trim().replace(/^https?:\/\/github\.com\//,"").replace(/\/$/,"");gh.token=$("#g-token").value.trim();
    $("#g-err").textContent="…";
    ghVerify().then(function(ok){
      if(!ok){$("#g-err").textContent=t("ghBad");return}
      LS.set("gh-token",gh.token);LS.set("gh-repo",gh.repo);admin=true;closeSheet();rerender();
    });
    return;
  }
  if(!admin)return;
  if(f.id==="settings-form"){
    var s=STATE.shop;function v(id){return $("#"+id).value.trim()}
    s.name=v("s-name")||s.name;s.logo=pendingImgs["s-logo"]||"";s.banner=pendingImgs["s-banner"]||"";
    s.tagline_uz=v("s-taguz");s.tagline_ru=v("s-tagru");s.promo_uz=v("s-prouz");s.promo_ru=v("s-proru");
    s.telegram=v("s-tg").replace(/^@/,"").replace(/^https?:\/\/t\.me\//,"");s.phone=v("s-phone").replace(/[^\d+]/g,"");
    s.instagram=v("s-ig").replace(/^@/,"").replace(/^https?:\/\/(www\.)?instagram\.com\//,"").replace(/[\/?].*$/,"");
    s.city=v("s-city");s.delivery_uz=v("s-deluz");s.delivery_ru=v("s-delru");s.bot=v("s-bot").replace(/^@/,"");
    closeSheet();markDirty();return;
  }
  if(f.id==="cats-form"){STATE.cats=collectCats();closeSheet();markDirty();return}
  if(f.id==="prod-form"){
    function g(k){return $("#p-"+k).value.trim()}
    if(!g("name_uz")&&!g("name_ru")){$("#p-err").textContent=t("nameUz");return}
    var old=prod(f.dataset.id);
    var rec={id:f.dataset.id,cat:$("#p-cat").value,name_uz:g("name_uz")||g("name_ru"),name_ru:g("name_ru")||g("name_uz"),size:g("size"),metal:g("metal"),
      desc_uz:g("desc_uz"),desc_ru:g("desc_ru"),price:parseInt(g("price").replace(/\D/g,""),10)||0,imgs:pendingList.slice(),stock:$("#p-stock").checked};
    if(old&&old.sample&&old.name_uz===rec.name_uz&&!rec.imgs.length)rec.sample=true;
    if(f.dataset.new==="1")STATE.products.unshift(rec);else STATE.products=STATE.products.map(function(p){return p.id===rec.id?rec:p});
    closeSheet();markDirty();return;
  }
});
window.addEventListener("beforeunload",function(e){if(admin&&dirty){e.preventDefault();e.returnValue=""}});

function start(){
  render(false);
  if(MODE==="artifact"){
    if(window.claude&&typeof window.claude.use==="function"){
      Promise.all([window.claude.use("user"),window.claude.use("artifact")]).then(function(r){
        var u=r[0];artifactNs=r[1];if(!u||!artifactNs)return;
        return u.canEdit().then(function(ok){if(ok){admin=true;rerender()}});
      }).catch(function(){});
    }
  }else{
    gh.repo=LS.get("gh-repo")||guessRepo();
    if(gh.token&&gh.repo)ghVerify().then(function(ok){if(ok){admin=true;rerender()}});
    if(location.hash==="#admin"&&!gh.token)loginSheet();
  }
}
if(MODE==="artifact"){STATE=normalize(JSON.parse(raw));start()}
else{
  fetch("data.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(s){STATE=normalize(s);start()})
   .catch(function(){$("#app").innerHTML='<div class="loading">'+t("loadFail")+'</div>'});
}
})();
</script>
