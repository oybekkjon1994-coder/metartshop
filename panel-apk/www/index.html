<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1214">
<title>Metartshop — Boshqaruv</title>
<style>
  :root{ --bg:#0e1214; --card:#171d20; --card2:#1e2528; --line:#2a3236;
         --fg:#eef2f3; --mut:#8c989d; --yel:#ffc400; --grn:#39d98a; --red:#ff6b6b; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--fg);
        font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
        padding:16px 16px 40px; max-width:620px; margin:0 auto; }
  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  h1{ font-size:20px; margin:0; letter-spacing:.2px; }
  h1 b{ color:var(--yel); }
  .upd{ font-size:12px; color:var(--mut); }
  .row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
  .card h2{ font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--mut);
            margin:0 0 10px; font-weight:600; }
  .big{ font-size:26px; font-weight:700; }
  .sub{ font-size:13px; color:var(--mut); margin-top:4px; }
  .up{ color:var(--grn); } .down{ color:var(--red); }
  .stats{ display:flex; gap:18px; }
  .stat .n{ font-size:22px; font-weight:700; } .stat .l{ font-size:11px; color:var(--mut); }
  .plist{ display:flex; flex-direction:column; gap:8px; }
  .pitem{ display:flex; align-items:center; gap:10px; background:var(--card2);
          border-radius:10px; padding:9px 11px; font-size:13px; }
  .pitem .t{ font-variant-numeric:tabular-nums; color:var(--yel); font-weight:600; min-width:40px; }
  .pitem .nm{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pitem .st{ font-size:11px; color:var(--mut); }
  .chip{ font-size:10px; padding:2px 7px; border-radius:20px; background:#243; color:var(--grn); }
  .chip.err{ background:#412; color:var(--red); }
  .post{ display:flex; gap:10px; align-items:center; background:var(--card2);
         border-radius:10px; padding:9px 11px; margin-bottom:8px; text-decoration:none; color:var(--fg); }
  .post .cap{ flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .post .eng{ font-size:12px; color:var(--mut); white-space:nowrap; }
  .refresh{ background:var(--yel); color:#111; border:none; border-radius:12px; padding:9px 14px;
            font-weight:700; font-size:13px; }
  .err{ color:var(--red); font-size:13px; }
  .muted{ color:var(--mut); font-size:13px; }
  footer{ text-align:center; color:var(--mut); font-size:11px; margin-top:18px; }
</style>
</head>
<body>
<header>
  <h1>Metart<b>shop</b></h1>
  <button class="refresh" onclick="load()">Yangilash</button>
</header>
<div class="upd" id="upd">Yuklanmoqda…</div>

<div class="row" style="margin-top:12px">
  <div class="card"><h2>Dollar</h2><div class="big" id="usd">—</div><div class="sub" id="usdd"></div></div>
  <div class="card"><h2>Ob-havo</h2><div class="big" id="temp">—</div><div class="sub" id="tempd"></div></div>
</div>

<div class="card" style="margin-bottom:12px">
  <h2>Instagram — @<span id="iguser">metart_shop</span></h2>
  <div class="stats">
    <div class="stat"><div class="n" id="foll">—</div><div class="l">Obunachi</div></div>
    <div class="stat"><div class="n" id="media">—</div><div class="l">Post</div></div>
    <div class="stat"><div class="n" id="kecha">—</div><div class="l">Kecha chiqdi</div></div>
  </div>
</div>

<div class="card" style="margin-bottom:12px">
  <h2>Oxirgi postlar</h2>
  <div id="recent" class="muted">—</div>
</div>

<div class="card" style="margin-bottom:12px">
  <h2>Bugun rejada</h2>
  <div id="today" class="plist"></div>
</div>

<div class="card">
  <h2>Keyingi postlar</h2>
  <div id="next" class="plist"></div>
</div>

<footer>Avto-yangilanadi · GitHub'da ishlaydi · <span id="err"></span></footer>

<script>
const $ = id => document.getElementById(id);
const nf = n => (n==null?'—':(''+n).replace(/\B(?=(\d{3})+(?!\d))/g,' '));
const ico = t => /REEL/i.test(t)?'🎬':(/STOR/i.test(t)?'📖':'🖼');
function stChip(s){ if(s==='chiqdi') return '<span class="chip">chiqdi</span>';
  if(s==='xato') return '<span class="chip err">xato</span>';
  if(s==="o'tkazildi") return '<span class="st">o\'tkazildi</span>'; return ''; }

async function load(){
  try{
    const r = await fetch('https://oybekkjon1994-coder.github.io/metartshop/reja/dashboard.json?_='+Date.now());
    const d = await r.json();
    $('upd').textContent = 'Yangilangan: '+d.updated;

    const u = d.dollar||{};
    if(u.rate){ $('usd').textContent = nf(u.rate)+" so'm";
      if(u.diff){ const up=u.diff>0; $('usdd').innerHTML='<span class="'+(up?'up':'down')+'">'+(up?'▲':'▼')+' '+nf(Math.abs(u.diff))+'</span> kecha'; } }
    else $('usd').textContent='—';

    const w = d.obhavo||{};
    if(w.temp!=null){ $('temp').textContent = w.temp+'°'; $('tempd').textContent = (w.desc||'')+' · '+w.lo+'…'+w.hi+'°'; }

    const ig = d.instagram||{};
    $('iguser').textContent = ig.username||'metart_shop';
    $('foll').textContent = nf(ig.followers);
    $('media').textContent = nf(ig.media_count);
    $('kecha').textContent = nf(d.kecha_chiqdi);

    const rc = (ig.posts||[]);
    $('recent').innerHTML = rc.length ? rc.map(p=>
      '<a class="post" href="'+(p.link||'#')+'" target="_blank"><span>'+ico(p.type)+'</span>'+
      '<span class="cap">'+(p.caption||'—')+'</span>'+
      '<span class="eng">❤ '+nf(p.like)+'  💬 '+nf(p.comment)+'</span></a>').join('')
      : '<div class="muted">Ma\'lumot yo\'q (token insights ruxsatisiz)</div>';

    const tr = (d.bugun_postlar||[]);
    $('today').innerHTML = tr.length ? tr.map(p=>
      '<div class="pitem"><span class="t">'+(p.at||'').slice(11,16)+'</span>'+
      '<span class="nm">'+ico(p.type)+' '+p.id+'</span>'+stChip(p.status)+'</div>').join('')
      : '<div class="muted">Bugun rejada post yo\'q</div>';

    const nx = (d.keyingi_postlar||[]);
    $('next').innerHTML = nx.length ? nx.map(p=>
      '<div class="pitem"><span class="t">'+(p.at||'').slice(5,10).replace('-','.')+'</span>'+
      '<span class="nm">'+ico(p.type)+' '+p.id+'</span><span class="st">'+(p.at||'').slice(11,16)+'</span></div>').join('')
      : '<div class="muted">—</div>';

    $('err').textContent='';
  }catch(e){ $('err').textContent='xato: '+e.message; }
}
load();
setInterval(load, 5*60*1000); // har 5 daqiqada o'zi yangilanadi
</script>
</body>
</html>
