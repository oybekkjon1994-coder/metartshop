name: Hisobot va signal

on:
  schedule:
    - cron: '0 3 * * *'      # har kuni 08:00 (Toshkent) - ertalabki hisobot
    - cron: '0 4 * * 1'      # dushanba 09:00 (Toshkent) - haftalik tahlil
    - cron: '*/30 * * * *'   # har 30 daqiqada - xatolik signali
  workflow_dispatch:
    inputs:
      rejim:
        description: 'morning / weekly / alert'
        default: 'morning'

permissions:
  contents: write

concurrency:
  group: hisobot
  cancel-in-progress: false

jobs:
  hisobot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rejimni aniqlash
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "0 3 * * *") echo "mode=morning" >> $GITHUB_OUTPUT ;;
            "0 4 * * 1") echo "mode=weekly" >> $GITHUB_OUTPUT ;;
            "*/30 * * * *") echo "mode=alert" >> $GITHUB_OUTPUT ;;
            *) echo "mode=${{ github.event.inputs.rejim || 'morning' }}" >> $GITHUB_OUTPUT ;;
          esac
      - name: Ishga tushirish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python tools/hisobot.py ${{ steps.m.outputs.mode }}
      - name: Holatni saqlash
        run: |
          git config user.name "metartshop-bot"
          git config user.email "oybekkjon1994@gmail.com"
          git add reja/hisobot-holat.json || true
          git diff --cached --quiet || git commit -q -m "hisobot: holat yangilandi"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
