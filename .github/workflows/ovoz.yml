name: Reels ovoz

on:
  push:
    branches: [main]
    paths: ['tools/ovoz/*.json', 'tools/ovoz.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ovoz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: (which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)) && pip install -q edge-tts
      - name: Ovoz qo'shish (o'zgargan json fayllar)
        run: |
          files=$(git diff --name-only HEAD~1 HEAD -- 'tools/ovoz/*.json')
          [ -z "$files" ] && files=$(ls tools/ovoz/*.json)
          python tools/ovoz.py $files
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add reels/*-ovoz.mp4
          git commit -m "Reels: o'zbekcha ovoz qo'shildi" || exit 0
          git pull --rebase && git push
