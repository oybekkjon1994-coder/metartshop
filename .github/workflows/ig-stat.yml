name: Instagram holati
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - id: run
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python tools/ig_stat.py
      - run: |
          git config user.name "ig-post-bot"
          git config user.email "ig-post-bot@users.noreply.github.com"
          git add reja/ig-stat.json
          git commit -m "Instagram holati yangilandi" || echo "o'zgarish yo'q"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
