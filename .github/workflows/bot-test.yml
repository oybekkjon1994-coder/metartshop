name: bot-test
on:
  push:
    paths: ['bot/**', '.github/workflows/bot-test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: bot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev
      - run: node test/design_test.js
      - run: node test/mock.js
      - run: node test/offers_test.js
