name: bot-test
on:
  push:
    paths: ['bot/**', '.github/workflows/bot-test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: bot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev
      - run: node test/design_test.js
      - run: node test/mock.js
      - run: node test/offers_test.js
      - run: node test/dxfcalc_test.js
      - run: node test/igreply_test.js
      - run: node test/offers_test.js
        env: { HOLIDAY_TODAY: '12-26' }
  wasm:
    # Android/Termux sharoiti: rasm kutubxonasining WebAssembly versiyasi
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    defaults: { run: { working-directory: bot } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund --cpu=wasm32 --os=linux sharp@0.35.4
      - run: node -e "const s=require('sharp'); console.log(s.versions)"
      - run: node test/design_test.js
      - run: node test/mock.js
      - run: bash -n termux-install.sh
