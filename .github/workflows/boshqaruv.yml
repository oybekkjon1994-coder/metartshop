name: Boshqaruv ma'lumoti

on:
  schedule:
    - cron: '7 */2 * * *'   # har 2 soatda ma'lumotni yangilaydi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boshqaruv
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ma'lumot yig'ish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python tools/dashboard_data.py
      - name: dashboard.json ni saqlash
        run: |
          git config user.name "metartshop-bot"
          git config user.email "oybekkjon1994@gmail.com"
          git add reja/dashboard.json
          git commit -m "boshqaruv ma'lumoti yangilandi" || echo "o'zgarish yo'q"
          git push || echo "push o'tmadi"
