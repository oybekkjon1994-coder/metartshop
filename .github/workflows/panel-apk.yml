name: Panel APK

on:
  push:
    branches: [main]
    paths: ['panel-apk/**', '.github/workflows/panel-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel-apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kutubxonalar
        run: npm install --no-audit --no-fund

      - name: Android loyihasi
        run: |
          npx cap add android
          npx cap sync android

      - name: Ikonka va splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0e1214' --splashBackgroundColor '#0e1214' || echo "ikonka yaratilmadi"

      - name: Versiya raqami
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $((3000 + ${{ github.run_number }}))/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: APK yig'ish
        working-directory: panel-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Imzolash
        env:
          KS_PASS: m3tartsh0p_pan3l_2026
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks signing/panel.jks --ks-key-alias panel --ks-pass env:KS_PASS --key-pass env:KS_PASS --out panel.apk aligned.apk
          $BT/apksigner verify --print-certs panel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: panel-apk
          path: panel-apk/panel.apk

      - name: Releases sahifasiga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panel-v1.0.${{ github.run_number }}
          name: Metartshop Panel ${{ github.run_number }}
          files: panel-apk/panel.apk
