name: Haqiqiy ovoz montaji

on:
  push:
    branches: [main]
    paths: ['ovoz-yozuv/**', 'tools/ovoz_yozuv.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ovoz-yozuv
  cancel-in-progress: false

jobs:
  montaj:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Montaj
        run: python tools/ovoz_yozuv.py
      - name: Saqlash
        run: |
          git config user.name "metartshop-bot"
          git config user.email "oybekkjon1994@gmail.com"
          git add -A reels reja ovoz-yozuv/.islangan.json 2>/dev/null || git add -A reels reja
          git diff --cached --quiet || git commit -q -m "Haqiqiy ovoz montaj qilindi"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
