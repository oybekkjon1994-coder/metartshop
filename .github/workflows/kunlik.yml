name: Kunlik hisobot

on:
  schedule:
    - cron: '0 3 * * *'   # har kuni 08:00 Toshkent (03:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hisobot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hisobotni yuborish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python tools/kunlik_hisobot.py
